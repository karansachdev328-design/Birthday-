<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverse Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            transition: background 0.8s ease, color 0.8s ease;
            overflow: hidden;
        }

        /* The Frosted Glass Container */
        .glass-panel {
            width: 100%;
            max-width: 450px;
            padding: 30px 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        /* Animation for when text changes */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
            display: block;
            text-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-family: 'Playfair Display', serif;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 25px;
            min-height: 120px;
            font-family: 'Poppins', sans-serif;
        }

        /* Base Button & Container Styling */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            background: transparent;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* --- THEME COLORS & HIGH CONTRAST BUTTONS --- */
        
        .theme-earth { background: linear-gradient(135deg, #fdfbf7, #fce4ec); color: #8a6d3b; }
        .theme-earth button { border: 2px solid #8a6d3b; color: #8a6d3b; }
        .theme-earth button:hover { background: #8a6d3b; color: #fdfbf7; }

        .theme-cinema { background: linear-gradient(135deg, #2b2b2b, #1a1a1a); color: #e8e8e8; }
        .theme-cinema button { border: 2px solid #e8e8e8; color: #e8e8e8; }
        .theme-cinema button:hover { background: #e8e8e8; color: #1a1a1a; }

        .theme-fairy { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); color: #5e35b1; }
        .theme-fairy button { border: 2px solid #5e35b1; color: #5e35b1; }
        .theme-fairy button:hover { background: #5e35b1; color: #fdfbf7; }

        .theme-royal { background: linear-gradient(135deg, #4a0404, #7a1111); color: #d4af37; }
        .theme-royal button { border: 2px solid #d4af37; color: #d4af37; }
        .theme-royal button:hover { background: #d4af37; color: #4a0404; }

        .theme-god { background: linear-gradient(135deg, #fff1eb, #ace0f9); color: #8a6d3b; }
        .theme-god button { border: 2px solid #8a6d3b; color: #8a6d3b; }
        .theme-god button:hover { background: #8a6d3b; color: #fff1eb; }

        .theme-celestial { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #f8cdda; }
        .theme-celestial button { border: 2px solid #f8cdda; color: #f8cdda; }
        .theme-celestial button:hover { background: #f8cdda; color: #0f2027; }

        .theme-finale { background: #fffafa; color: #b08d57; }
        .theme-finale h1 { font-size: 2.1rem; }
        .theme-finale .glass-panel { background: #fff; border: 2px solid #d4af37; box-shadow: 0 10px 40px rgba(212, 175, 55, 0.15); }
        .theme-finale button { background: #d4af37; color: #fff; border: 2px solid #d4af37; }
        .theme-finale button:hover { background: #b08d57; border-color: #b08d57; }

    </style>
</head>
<body class="theme-earth" id="body-bg">

    <div class="glass-panel fade-in" id="content-box">
        <span class="icon" id="universe-icon">🌍</span>
        <h1 id="universe-title">Happy 25th Birthday Manjiri!</h1>
        <p id="universe-text">Welcome to your personal Multiverse Scanner. I know you are intelligent, resilient, and gorgeous in this reality... but let's check the alternate timelines just to be scientifically sure. Click the button below to initiate the scan!</p>
        
        <div class="btn-container" id="button-container">
            <button onclick="nextUniverse()">Scan Alternate Timeline</button>
        </div>
    </div>

    <script>
        const universes = [
            {
                theme: "theme-earth",
                icon: "🌍",
                title: "Happy 25th Birthday Manjiri!",
                text: "Welcome to your personal Multiverse Scanner. I know you are intelligent, resilient, and gorgeous in this reality... but let's check the alternate timelines just to be scientifically sure. Click the button below to initiate the scan!",
                btn: "Scan Alternate Timeline"
            },
            {
                theme: "theme-cinema",
                icon: "🎬",
                title: "Universe Noir-1960",
                text: "A vintage masterpiece. In this cinematic reality, you are the untouchable leading lady with flawless style. Everyone else is just an extra.",
                btn: "Scan Alternate Timeline"
            },
            {
                theme: "theme-fairy",
                icon: "🧚‍♀️",
                title: "Universe Fae-09",
                text: "A mystical dimension woven from starlight and ancient forest magic. Here, you are the supreme Fae—effortlessly charming, wildly resilient, and radiating an ethereal beauty that leaves the entire woodland in awe.",
                btn: "Scan Alternate Timeline"
            },
            {
                theme: "theme-royal",
                icon: "🏰",
                title: "Universe Sovereign-1",
                text: "A timeline of grand empires, velvet, and gold. Here, you are the undisputed Queen. You wear the crown with absolute grace, commanding the room without saying a word. Long live the Queen.",
                btn: "Scan Alternate Timeline"
            },
            {
                theme: "theme-god",
                icon: "🏛️",
                title: "Universe Pantheon-7",
                text: "Ascending to the sacred realm of myth and divinity. In this heavenly timeline, you are worshipped as a literal Goddess. Your wisdom, power, and radiant aura have even the ancient deities bowing in absolute reverence.",
                btn: "Scan Alternate Timeline"
            },
            {
                theme: "theme-celestial",
                icon: "✨",
                title: "Universe Celestial",
                text: "Floating among the stars and galaxies. In this cosmic timeline, you are a celestial being made of stardust, outshining every single constellation in the sky.",
                btn: "Initiate Final Scan"
            },
            {
                theme: "theme-finale",
                icon: "👑",
                title: "Scan Complete.",
                text: "The data is undeniable. I checked them all, and it's a scientific fact: you are simply the best woman across all the universes. Happy 25th Birthday! 🥂",
                btn: "One Last Thing..."
            },
            {
                theme: "theme-finale",
                icon: "💌",
                title: "One Final Question",
                text: "Did you enjoy this little birthday web page?",
                isQuestionPage: true,
                buttons: [
                    "Yes",
                    "Definitely Yes",
                    "100% Yes",
                    "Without a doubt, Yes!"
                ]
            }
        ];

        let currentIndex = 0;

        function nextUniverse() {
            currentIndex++;
            const currentData = universes[currentIndex];
            const contentBox = document.getElementById('content-box');
            const btnContainer = document.getElementById('button-container');

            // Trigger animation
            contentBox.classList.remove('fade-in');
            void contentBox.offsetWidth; 
            contentBox.classList.add('fade-in');

            // Update content
            document.getElementById('body-bg').className = currentData.theme;
            document.getElementById('universe-icon').innerText = currentData.icon;
            document.getElementById('universe-title').innerText = currentData.title;
            document.getElementById('universe-text').innerText = currentData.text;

            // Check if we are on the final question page with multiple buttons
            if (currentData.isQuestionPage) {
                let buttonsHTML = "";
                // Generate the 4 "Yes" buttons
                currentData.buttons.forEach(btnText => {
                    buttonsHTML += `<button onclick="finishScanner()">${btnText}</button>`;
                });
                btnContainer.innerHTML = buttonsHTML;
            } else {
                // Generate a normal single button
                btnContainer.innerHTML = `<button onclick="nextUniverse()">${currentData.btn}</button>`;
            }
        }

        function finishScanner() {
            // This is the message that pops up when she clicks any of the "Yes" buttons!
            alert("I knew you would like it! Happy Birthday Manjiri! ❤️");
        }
    </script>
</body>
</html>
